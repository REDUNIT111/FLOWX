<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowX</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FlowX</h1>
        <p>Turn unused capacity into opportunity.</p>
    </header>

    <main>
        <div id="dashboard">

    <h2>FlowX Dashboard</h2>

    <div class="dashboard-container">

        <div class="dashboard-card">
            <h3>📦</h3>
            <p>Inventory Listings</p>
            <strong id="inventoryCount">0</strong>
        </div>


        <div class="dashboard-card">
            <h3>🚚</h3>
            <p>Transport Listings</p>
            <strong id="transportCount">0</strong>
        </div>


        <div class="dashboard-card">
            <h3>📋</h3>
            <p>Pending Requests</p>
            <strong id="requestCount">0</strong>
        </div>


        <div class="dashboard-card">
            <h3>✅</h3>
            <p>Completed Deals</p>
            <strong id="transactionCount">0</strong>
        </div>

    </div>

</div>
        <button onclick="showSellerForm()">
            Sell Excess Inventory
        </button>
<button onclick="showRequests()">
    View Requests
</button>
        <button onclick="showInventory()">
            Buy Inventory
        </button>
        <button onclick="showTransportList()">
    View Transport
</button>
<button onclick="showTransportRequests()">
    Transport Requests
</button>
        <button onclick="showTransactions()">
    View Transactions
</button>
        <button onclick="showTransport()">
            Transport
        </button>
          <button onclick="resetFlowXData()" class="reset-button">
    🗑️ Reset Demo Data
</button>

        <div id="sellerForm">

            <h2>Sell Excess Inventory</h2>

            <input type="text" id="productName" placeholder="Product name">

            <input
    type="number"
    id="quantity"
    placeholder="Quantity"
    min="1"
>

<select id="unit">
    <option value="">Select unit</option>
    <option value="kg">Kilograms (kg)</option>
    <option value="tonnes">Tonnes</option>
    <option value="units">Units</option>
    <option value="boxes">Boxes</option>
    <option value="litres">Litres</option>
</select>
           <input
    type="text"
    id="location"
    placeholder="Pickup location"
>

<input
    type="number"
    id="price"
    placeholder="Price per unit (₹)"
    min="0"
    step="0.01"
>
            <button onclick="submitInventory()">
                Add Inventory
            </button>

        </div>


        <div id="message"></div>
        <div id="transportForm">

    <h2>🚚 Add Transport Capacity</h2>

    <input
        type="text"
        id="vehicleType"
        placeholder="Vehicle type"
    >

    <input
    type="number"
    id="capacity"
    placeholder="Available capacity"
    min="1"
>

<select id="capacityUnit">
    <option value="">Select capacity unit</option>
    <option value="kg">Kilograms (kg)</option>
    <option value="tonnes">Tonnes</option>
    <option value="units">Units</option>
    <option value="boxes">Boxes</option>
    <option value="litres">Litres</option>
</select>

    <input
        type="text"
        id="transportFrom"
        placeholder="Current location"
    >

    <input
        type="text"
        id="transportTo"
        placeholder="Destination"
    >

    <input
        type="number"
        id="transportPrice"
        placeholder="Transport price (₹)"
        min="0"
    >

    <button onclick="submitTransport()">
        Add Transport
    </button>

</div>

    </main>

    <script src="script.js"></script>

</body>

</html>
