<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowX - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FlowX</h1>
        <p>Turn unused capacity into opportunity.</p>
    </header>

    <main>

        <!-- =========================
             DASHBOARD
             ========================= -->

        <div id="dashboard">

            <h2>FlowX Dashboard</h2>

            <div class="dashboard-container">

                <div class="dashboard-card">
                    <h3>📦</h3>
                    <p>Inventory Listings</p>
                    <strong id="inventoryCount">0</strong>
                </div>

                <div class="dashboard-card">
                    <h3>🚚</h3>
                    <p>Transport Listings</p>
                    <strong id="transportCount">0</strong>
                </div>

                <div class="dashboard-card">
                    <h3>📋</h3>
                    <p>Pending Requests</p>
                    <strong id="requestCount">0</strong>
                </div>

                <div class="dashboard-card">
                    <h3>✅</h3>
                    <p>Completed Deals</p>
                    <strong id="transactionCount">0</strong>
                </div>

            </div>

        </div>


        <!-- =========================
             NAVIGATION
             ========================= -->

        <div class="flowx-navigation">

            <button onclick="window.location.href='seller.html'">
                📦 Seller
            </button>

            <button onclick="window.location.href='inventory.html'">
                🛒 Buy Inventory
            </button>

            <button onclick="window.location.href='transport.html'">
                🚚 Transporter
            </button>

            <button onclick="window.location.href='transactions.html'">
                📊 Transactions
            </button>

        </div>


        <!-- =========================
             RESET DEMO
             ========================= -->

        <button
            onclick="resetFlowXData()"
            class="reset-button">
            🗑️ Reset Demo Data
        </button>

        <div id="message"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
