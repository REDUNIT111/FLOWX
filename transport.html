<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowX - Transporter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="brand">
            <img src="flowx-icon.png" alt="FlowX logo">
            <h1>FlowX</h1>
        </div>
        <p>Transport unused capacity efficiently.</p>
    </header>

    <nav class="site-nav">
        <a href="index.html">🏠 Dashboard</a>
        <a href="seller.html">📦 Seller</a>
        <a href="inventory.html">🛒 Buy Inventory</a>
        <a href="transport.html" class="current" aria-current="page">🚚 Transporter</a>
        <a href="transactions.html">📊 Transactions</a>
    </nav>

    <main>

        <!-- TABS -->

        <div class="flowx-navigation">

            <button id="addTransportBtn" onclick="showTransport()">
                🚚 Add Transport Capacity
            </button>

            <button id="availableTransportBtn" onclick="showTransportList()">
                🚛 Available Transport
            </button>

            <button id="transportRequestsBtn" onclick="showTransportRequests()">
                📋 Transport Requests
            </button>

        </div>


        <!-- TRANSPORT FORM -->

        <div id="transportForm">

            <h2>Add Transport Capacity</h2>
            <p class="form-note">Register a vehicle, its route and the space you have free.</p>

            <div class="form-field">
                <label for="vehicleType">Vehicle type</label>
                <input type="text" id="vehicleType" placeholder="e.g. Truck">
            </div>

            <div class="form-row">

                <div class="form-field">
                    <label for="capacity">Available capacity</label>
                    <input type="number" id="capacity" placeholder="e.g. 500" min="1">
                </div>

                <div class="form-field">
                    <label for="capacityUnit">Unit</label>
                    <select id="capacityUnit">
                <option value="">Select capacity unit</option>
                <option value="kg">Kilograms (kg)</option>
                <option value="tonnes">Tonnes</option>
                <option value="units">Units</option>
                <option value="boxes">Boxes</option>
                <option value="litres">Litres</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-field">
                    <label for="transportFrom">Starting location</label>
                    <input type="text" id="transportFrom" placeholder="e.g. Bilaspur">
                </div>

                <div class="form-field">
                    <label for="transportTo">Destination</label>
                    <input type="text" id="transportTo" placeholder="e.g. Raipur">
                </div>

            </div>

            <div class="form-field">
                <label for="transportPrice">Transport price (₹)</label>
                <input type="number" id="transportPrice" placeholder="e.g. 1000" min="0" step="0.01">
            </div>

            <p class="form-hint">
                ℹ️ Automatic matching needs the same city names as the seller and buyer, and kg or tonnes.
            </p>

            <button class="form-submit" onclick="submitTransport()">
                Add Transport
            </button>

        </div>


        <!-- TRANSPORT CONTENT -->

        <div id="message"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
